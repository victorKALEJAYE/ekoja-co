<!doctype html><html><head><meta charset="utf-8"><title>Logo sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@600&display=swap" rel="stylesheet">
<style>body{font-family:Manrope,sans-serif;margin:0;background:#F7F4EE;color:#0E1E3A}.g{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:32px}.c{background:#fff;padding:28px;border:1px solid #E4DED2}.c.d{background:#0E1E3A}img{width:100%;max-height:160px;object-fit:contain}p{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#8A6A24}</style></head><body><div class="g">
<div class="c"><p>Primary — horizontal</p><img src="ojekoja-logo-horizontal.svg"></div>
<div class="c d"><p>Reversed</p><img src="ojekoja-logo-reversed.svg"></div>
<div class="c"><p>Stacked</p><img src="ojekoja-logo-stacked.svg"></div>
<div class="c"><p>Crest icon / favicon &amp; mark</p><div style="display:flex;gap:40px;justify-content:center"><img src="ojekoja-icon.svg" style="width:120px"><img src="ojekoja-mark.svg" style="width:140px"></div></div>
</div></body></html>
